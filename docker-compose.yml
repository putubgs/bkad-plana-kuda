services:

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    
    container_name: app-plana-kuda

    restart: unless-stopped

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    env_file:
      - .env
      
    environment:
      TZ: ${TZ:-Asia/Makassar}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    volumes:
      - .:/app
      - /app/node_modules

  postgres:
    image: postgres:17-alpine
    container_name: postgres-plana-kuda

    restart: unless-stopped

    env_file:
      - .env

    environment:
      TZ: ${TZ:-Asia/Makassar}
      PGTZ: ${TZ:-Asia/Makassar}

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine

    container_name: redis-plana-kuda

    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    volumes:
      - redis_data:/data
  
volumes:
  postgres_data:
  redis_data: